[package]
name = "pgp-vanity"
version = "0.1.0"
edition = "2024"
description = "Find an Ed25519 OpenPGP key whose v4 fingerprint starts with chosen hex digits"
license = "MIT OR Apache-2.0"
authors = ["Cole Leavitt <cole@unwrap.rs>"]
publish = false

[dependencies]
anyhow = "1"
# Builds and signs the final certificate; the search loop only uses its key import.
sequoia-openpgp = "2"
# Single-block SHA-1 compression for the hot loop (one 54-byte packet per try).
sha1 = { version = "0.10", features = ["compress"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
